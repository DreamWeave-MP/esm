# esm as a DreamWeave project: a Jess package. `jess` names the Package Source it publishes,
# the repository root's own jess.toml, and each release tag `esm-<version>` is one version of
# the package, packed by the Mod Template from that tag; every push packs a development build.
id = "4a20d171-25a6-471f-8e22-6e554c9e859c"
slug = "esm"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.esm"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
