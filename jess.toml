manifest_version = 1

[package]
id = "org.dreamweave.tes3"
version = "0.1.0"
jess_api = "1"
include = ["src"]
tests = ["tests/run.luau", "tests/style.luau"]

[modules]
"@tes3" = "src/init.luau"

# The module is inert API: it does nothing until something requires it, and it never touches the
# filesystem. Callers hand it bytes and get bytes back.

[[layer]]
id = "tes3.core"
exports = ["@tes3"]
