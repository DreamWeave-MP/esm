manifest_version = 1

[package]
id = "org.dreamweave.esm"
version = "0.1.0"
jess_api = "1"
include = ["src", "tests", "LICENSES"]
tests = ["tests/run.jsl", "tests/style.jsl"]

[modules]
"@esm" = "src/init.jsl"

# The module is inert API: it does nothing until something requires it, and it never touches the
# filesystem. Callers hand it bytes and get bytes back.

[[layer]]
id = "esm.core"
exports = ["@esm"]
